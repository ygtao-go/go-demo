<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI智能助手 - 豆包风格</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f8fa;color:#333;}
    /* 布局 */
    .layout-wrap{display:flex;height:100vh;overflow:hidden;}
    .left-menu{width:240px;background:#ffffff;border-right:1px solid #e5e6eb;flex-shrink:0;}
    .main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .header-top{height:60px;background:#fff;border-bottom:1px solid #e5e6eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
    .content-wrap{flex:1;padding:20px;overflow:auto;}

    /* 菜单 */
    .logo-box{height:60px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eee;}
    .logo-text{font-size:18px;font-weight:bold;color:#1677ff;}
    .el-menu-vertical-demo{border-right:none;}

    /* 聊天容器 豆包风格 */
    .chat-box{max-width:900px;margin:0 auto;}
    .item-input{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
    .item-ai{background:#f2f3f5;border-radius:12px;padding:16px;margin-bottom:16px;}
    pre{white-space:pre-wrap;word-wrap:break-word;}
    .submit-btn{background:#1677ff;border:none;border-radius:8px;padding:8px 16px;color:#fff;}
    textarea{border-radius:8px !important;}

    /* 移动端适配 */
    @media (max-width:768px){
      .left-menu{width:60px;}
      .logo-text{display:none;}
    }
  </style>
</head>
<body>
<div id="app" class="layout-wrap">
  <!-- 左侧菜单 -->
  <div class="left-menu">
    <div class="logo-box">
      <span class="logo-text">AI智能助手</span>
    </div>
    <el-menu
      default-active="chat"
      class="el-menu-vertical-demo"
      @select="changePage"
    >
      <el-menu-item index="chat">
        <span>AI对话</span>
      </el-menu-item>
      <el-menu-item index="codeGen">
        <span>代码生成</span>
      </el-menu-item>
      <el-menu-item index="codeExplain">
        <span>代码解释</span>
      </el-menu-item>
      <el-menu-item index="codeFix">
        <span>代码修复</span>
      </el-menu-item>
      <el-menu-item index="codeOpt">
        <span>代码优化</span>
      </el-menu-item>
      <el-menu-item index="admin">
        <span>用户管理</span>
      </el-menu-item>
    </el-menu>
  </div>

  <!-- 右侧主区域 -->
  <div class="main-wrap">
    <!-- 顶部栏 -->
    <div class="header-top">
      <div class="title">AI 智能开发助手</div>
      <div class="user-info" v-if="isLogin">
        <span>欢迎：{{ userInfo.username }}</span>
        <el-button text type="danger" @click="handleLogout">退出登录</el-button>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="content-wrap">
      <!-- 登录/注册 -->
      <div v-if="!isLogin" style="max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:12px;">
        <el-tabs v-model="loginTab">
          <el-tab-pane label="登录" name="login">
            <el-form label-width="60px">
              <el-form-item label="用户名">
                <el-input v-model="loginForm.username"></el-input>
              </el-form-item>
              <el-form-item label="密码">
                <el-input v-model="loginForm.password" show-password></el-input>
              </el-form-item>
              <el-form-item>
                <el-button type="primary" @click="handleLogin" style="width:100%">登录</el-button>
              </el-form-item>
            </el-form>
          </el-tab-pane>
          <el-tab-pane label="注册" name="reg">
            <el-form label-width="60px">
              <el-form-item label="用户名">
                <el-input v-model="regForm.username"></el-input>
              </el-form-item>
              <el-form-item label="密码">
                <el-input v-model="regForm.password" show-password></el-input>
              </el-form-item>
              <el-form-item>
                <el-button type="success" @click="handleReg" style="width:100%">注册</el-button>
              </el-form-item>
            </el-form>
          </el-tab-pane>
        </el-tabs>
      </div>


      <!-- AI对话首页 豆包聊天样式 -->
      <div v-if="isLogin && page === 'chat'" class="chat-box">
        <div style="text-align:center;margin:40px 0;">
          <h2>你好，我是AI智能助手</h2>
          <p style="color:#999;">可以问我问题、写代码、查bug、写文档</p>
        </div>
        <div class="item-input">
          <textarea v-model="askText" rows="4" placeholder="请输入你要提问的内容..."></textarea>
          <div style="text-align:right;margin-top:10px;">
            <button class="submit-btn" @click="chatSend">发送提问</button>
          </div>
        </div>
        <div v-if="chatReply" class="item-ai">
          <strong>AI回复：</strong>
          <pre>{{ chatReply }}</pre>
        </div>
      </div>

      <!-- 代码生成 -->
      <div v-if="isLogin && page === 'codeGen'" class="chat-box">
        <div class="item-input">
          <textarea v-model="prompt" rows="4" placeholder="描述你想要生成的代码..."></textarea>
          <div style="text-align:right;margin-top:10px;">
            <button class="submit-btn" @click="generateCode">生成代码</button>
          </div>
        </div>
        <div v-if="result1" class="item-ai">
          <pre>{{ result1 }}</pre>
        </div>
      </div>

      <!-- 代码解释 -->
      <div v-if="isLogin && page === 'codeExplain'" class="chat-box">
        <div class="item-input">
          <textarea v-model="codeExplain" rows="6" placeholder="粘贴需要解释的代码"></textarea>
          <div style="text-align:right;margin-top:10px;">
            <button class="submit-btn" @click="explainCode">解释代码</button>
          </div>
        </div>
        <div v-if="result2" class="item-ai">
          <pre>{{ result2 }}</pre>
        </div>
      </div>

      <!-- 代码修复 -->
      <div v-if="isLogin && page === 'codeFix'" class="chat-box">
        <div class="item-input">
          <textarea v-model="codeFix" rows="6" placeholder="粘贴报错/有问题代码"></textarea>
          <div style="text-align:right;margin-top:10px;">
            <button class="submit-btn" @click="fixCode">修复代码</button>
          </div>
        </div>
        <div v-if="result3" class="item-ai">
          <pre>{{ result3 }}</pre>
        </div>
      </div>

      <!-- 代码优化 -->
      <div v-if="isLogin && page === 'codeOpt'" class="chat-box">
        <div class="item-input">
          <textarea v-model="codeOpt" rows="6" placeholder="粘贴需要优化的代码"></textarea>
          <div style="text-align:right;margin-top:10px;">
            <button class="submit-btn" @click="optimizeCode">优化代码</button>
          </div>
        </div>
        <div v-if="result4" class="item-ai">
          <pre>{{ result4 }}</pre>
        </div>
      </div>

      <!-- 用户管理 -->
      <div v-if="isLogin && page === 'admin'">
        <el-table :data="userList" border>
          <el-table-column prop="id" label="ID" width="80"/>
          <el-table-column prop="username" label="用户名"/>
          <el-table-column label="操作" width="180">
            <template #default="scope">
              <el-button size="small" @click="openEdit(scope.row)">编辑</el-button>
              <el-button size="small" type="danger" @click="delUser(scope.row.id)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
      </div>

    </div>
  </div>

  <!-- 编辑弹窗 -->
  <el-dialog v-model="editDialog" title="编辑用户">
    <el-input v-model="editForm.username"></el-input>
    <template #footer>
      <el-button @click="editDialog=false">取消</el-button>
      <el-button type="primary" @click="saveEdit">保存</el-button>
    </template>
  </el-dialog>
</div>

<script>
const { createApp } = Vue
const app = createApp({
  setup(){
    // 全局状态
    const isLogin = Vue.ref(false)
    const page = Vue.ref("chat")
    const loginTab = Vue.ref("login")

    // 登录注册
    const loginForm = Vue.reactive({username:"",password:""})
    const regForm = Vue.reactive({username:"",password:""})
    const userInfo = Vue.ref({})

    // AI输入
    const askText = Vue.ref("")
    const chatReply = Vue.ref("")

    const prompt = Vue.ref("")
    const codeExplain = Vue.ref("")
    const codeFix = Vue.ref("")
    const codeOpt = Vue.ref("")

    const result1 = Vue.ref("")
    const result2 = Vue.ref("")
    const result3 = Vue.ref("")
    const result4 = Vue.ref("")

    // 用户管理
    const userList = Vue.ref([])
    const editDialog = Vue.ref(false)
    const editForm = Vue.reactive({id:"",username:""})

    // axios
    const request = axios.create({
      baseURL:"http://8.163.79.107:8080/api",
      timeout:60000
    })
    request.interceptors.request.use(config=>{
      let token = localStorage.getItem("token")
      if(token) config.headers.Authorization = "Bearer "+token
      return config
    })

    // 切换页面
    const changePage = (key)=>{
      page.value = key
    }

    // 登录
    const handleLogin = async ()=>{
      let res = await request.post("/user/login",loginForm)
      if(res.data.code === 200 || res.data.code === 1){
        localStorage.setItem("token",res.data.data)
        isLogin.value = true
        getUserInfo()
        getUserListData()
        ElMessage.success("登录成功")
      }else{
        ElMessage.error(res.data.msg||"登录失败")
      }
    }

    // 注册
    const handleReg = async ()=>{
      let res = await request.post("/user/register",regForm)
      if(res.data.code === 200 || res.data.code === 1){
        ElMessage.success("注册成功，请登录")
        loginTab.value = "login"
      }else{
        ElMessage.error(res.data.msg||"注册失败")
      }
    }

    // 获取个人信息
    const getUserInfo = async ()=>{
      let res = await request.get("/user/info")
      if(res.data.code === 200 || res.data.code === 1){
        userInfo.value = res.data.data
      }
    }

    // 用户列表
    const getUserListData = async ()=>{
      let res = await request.get("/user/list")
      if(res.data.code === 200 || res.data.code === 1){
        userList.value = res.data.data.list
      }
    }

    // 退出
    const handleLogout = ()=>{
      localStorage.removeItem("token")
      isLogin.value = false
      ElMessage.success("已退出")
    }

    // 通用AI请求
    // 1.对话
    const chatSend = async ()=>{
      chatReply.value = ""
      let res = await request.post("/ai/generate",{prompt:askText.value})
      if(res.data.code === 200){
        chatReply.value = res.data.data
      }else{
        chatReply.value = "请求失败："+(res.data.msg||"")
      }
    }
    // 2.代码生成
    const generateCode = async ()=>{
      result1.value = ""
      let res = await request.post("/ai/generate",{prompt:prompt.value})
      if(res.data.code === 200) result1.value = res.data.data
    }
    // 3.解释
    const explainCode = async ()=>{
      result2.value = ""
      let res = await request.post("/ai/explain",{code:codeExplain.value})
      if(res.data.code === 200) result2.value = res.data.data
    }
    // 4.修复
    const fixCode = async ()=>{
      result3.value = ""
      let res = await request.post("/ai/fix",{code:codeFix.value})
      if(res.data.code === 200) result3.value = res.data.data
    }
    // 5.优化
    const optimizeCode = async ()=>{
      result4.value = ""
      let res = await request.post("/ai/optimize",{code:codeOpt.value})
      if(res.data.code === 200) result4.value = res.data.data
    }

    // 编辑删除用户
    const openEdit = (row)=>{
      editForm.id = row.id
      editForm.username = row.username
      editDialog.value = true
    }
    const saveEdit = async ()=>{
      await request.post(`/user/edit/${editForm.id}`,{username:editForm.username})
      editDialog.value = false
      getUserListData()
      ElMessage.success("修改成功")
    }
    const delUser = async (id)=>{
      await request.post(`/user/delete/${id}`)
      getUserListData()
      ElMessage.success("删除成功")
    }

    // 自动登录
    const autoLogin = ()=>{
      if(localStorage.getItem("token")){
        isLogin.value = true
        getUserInfo()
        getUserListData()
      }
    }
    autoLogin()

    return{
      isLogin,page,loginTab,
      loginForm,regForm,userInfo,
      askText,chatReply,
      prompt,codeExplain,codeFix,codeOpt,
      result1,result2,result3,result4,
      userList,editDialog,editForm,
      changePage,handleLogin,handleReg,handleLogout,
      chatSend,generateCode,explainCode,fixCode,optimizeCode,
      openEdit,saveEdit,delUser
    }
  }
})
app.use(ElementPlus).mount("#app")
</script>
</body>
</html>
